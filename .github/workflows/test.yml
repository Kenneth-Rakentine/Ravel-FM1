name: test

on:
  push:
  pull_request:

jobs:
  beads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python packages
        run: pip install numpy
      - name: Fetch the original Beads source (for the reference)
        working-directory: tests/beads
        run: make fetch
      - name: Compare the port against the original
        working-directory: tests/beads
        run: make test
      - name: Build for a 32-bit embedded target (no C library)
        run: |
          sudo apt-get install -y clang
          clang --target=armv7m-none-eabi -mcpu=cortex-m4 -O2 -std=c99 -Wall -Wextra -Werror -ffreestanding -c core/beads/bd.c -o /tmp/bd.o
          clang --target=riscv32-unknown-elf -march=rv32imc -O2 -std=c99 -Wall -Wextra -Werror -ffreestanding -c core/beads/bd.c -o /tmp/bd_rv.o
          clang --target=armv7m-none-eabi -mcpu=cortex-m4 -O2 -std=c99 -Wall -Wextra -Werror -ffreestanding -DBD_NO_DELAY -DBD_READER_ONLY -c core/beads/bd.c -o /tmp/bd_slim.o
      - name: Keep the renders for listening
        uses: actions/upload-artifact@v4
        with:
          name: beads-renders
          path: tests/beads/out/*.wav

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python packages (font generator)
        run: pip install pillow
      - name: Build the simulator
        run: sh host/build_host.sh
      - name: Run the scenarios
        run: |
          mkdir -p build/scenarios
          for s in tests/scenarios/*.rvl; do ./build/host/ravel_host "$s" build/scenarios; done
      - name: Keep the screenshots and audio
        uses: actions/upload-artifact@v4
        with:
          name: simulator-output
          path: build/scenarios/

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get install -y clang lld
          pip install pillow
      - name: Build the WebAssembly emulator
        run: sh web/emu/build.sh
      - name: Smoke test
        run: node web/emu/test.mjs
      - name: One-file page
        run: python3 web/emu/bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: ravel-emulator
          path: build/web/ravel-emulator.html

  firmware:
    runs-on: ubuntu-latest
    # Ravel does not fit the FM-1's app area yet (see README, "The FM-1 build"): the job
    # reports the size and keeps the ELF and map, without failing the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Python packages (font generator)
        run: pip install pillow
      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh "$HOME/.jieli"
      - name: FM1 Open SDK
        run: sh tools/get_sdk.sh
      - name: Build, check and package
        run: JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" python3 tools/build_fm1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ravel-fm1
          path: |
            build/fm1/Ravel-FM1.fwsc
            build/fm1/ravel.elf
            build/fm1/ravel.map
            build/fm1/report.json
